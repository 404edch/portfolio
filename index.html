<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shizu's Workshop</title>
  <meta name="description" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=VT323&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=50.0">
</head>

<body class="outlast-theme">

  <div class="vignette-overlay" aria-hidden="true"></div>
  <div class="scanlines-overlay" aria-hidden="true"></div>

  <!-- ============ HERO / DOSSIER HEADER ============ -->
  <section class="hero" id="hero">
    <div class="hero-inner">

      <!-- Outlast / Murkoff Classified Stamp Header -->
      <div class="dossier-stamp-wrap">
        <div class="classified-stamp">CONFIDENTIAL</div>
      </div>

      <p class="eyebrow">SHIZU'S WORKSHOP</p>

      <!-- Vintage Typewriter Search Bar -->
      <div class="search-section" id="searchSection">
        <div class="search-box-container">
          <div class="search-label-row">
            <span class="search-icon" aria-hidden="true">
              <svg class="eye-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path class="eye-outline" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                <circle class="eye-pupil" cx="12" cy="12" r="3" fill="currentColor" />
                <path class="eye-lid-top" d="M1 12s4-7 11-7 11 7 11 7" />
              </svg>
            </span>
            <label for="searchInput" class="search-label">SEARCH BY NAME</label>
          </div>
          <div class="search-input-wrapper">
            <span class="prompt-symbol">&gt;</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Type project title or tag..."
              autocomplete="off" spellcheck="false">
            <button type="button" id="clearSearchBtn" class="clear-search-btn" aria-label="Clear Search"
              style="display:none;">&times;</button>
          </div>
        </div>
      </div>

      <!-- Dossier File Scroll Cue (Right under Search Bar) -->
      <button class="scroll-cue visible" id="scrollCue" aria-label="Scroll to the dossier file section">
        <span>DOSSIER FILE</span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M12 4v16M5 13l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>

      <!-- Printer Dispatch Stage -->
      <div class="printer-stage" id="printerStage">
        <!-- Single Column Ticket Container -->
        <div class="tickets tickets-column" id="tickets" aria-live="polite">
          <div class="tickets-wrapper-inner" id="ticketsInner"></div>
        </div>

        <!-- Printer Machine -->
        <div class="printer-wrap" id="printerWrap">
          <button class="printer-btn" id="printBtn" aria-label="Press the lever to print the ticket collection">
            <svg class="printer-svg" viewBox="0 0 300 240" aria-hidden="true" focusable="false">
              <!-- feet -->
              <rect x="55" y="206" width="26" height="10" rx="2" fill="#141210" />
              <rect x="219" y="206" width="26" height="10" rx="2" fill="#141210" />

              <!-- body -->
              <rect x="40" y="86" width="220" height="122" rx="10" fill="#2C2722" stroke="#0F0D0B" stroke-width="4" />

              <!-- industrial plate details -->
              <line x1="45" y1="100" x2="255" y2="100" stroke="#1B1815" stroke-width="2" />
              <circle cx="50" cy="94" r="2.5" fill="#8C8070" />
              <circle cx="250" cy="94" r="2.5" fill="#8C8070" />
              <circle cx="50" cy="200" r="2.5" fill="#8C8070" />
              <circle cx="250" cy="200" r="2.5" fill="#8C8070" />

              <!-- top deck -->
              <rect x="40" y="54" width="220" height="42" rx="6" fill="#1C1A17" stroke="#0F0D0B" stroke-width="3" />

              <!-- ticket slot -->
              <rect x="94" y="44" width="112" height="18" rx="4" fill="#0A0908" stroke="#2C2722" stroke-width="2" />
              <rect x="100" y="48" width="100" height="6" rx="2" fill="#3D1210" />

              <!-- indicator light -->
              <circle class="printer-light" cx="218" cy="74" r="7" fill="#C92A2A" />

              <!-- label plate -->
              <rect x="66" y="142" width="168" height="48" rx="4" fill="#D9CBBA" stroke="#1A1815" stroke-width="3" />
              <text x="150" y="162" text-anchor="middle" class="plate-text">DISPATCHER</text>
              <text x="150" y="179" text-anchor="middle" class="plate-subtext">Dunder Mifflin Inc.</text>

              <!-- lever / press button -->
              <g class="printer-press">
                <rect x="30" y="115" width="20" height="52" rx="4" fill="#1C1916" stroke="#000" stroke-width="2" />
                <circle cx="40" cy="106" r="18" fill="#9E2A2B" stroke="#000" stroke-width="3" />
                <circle cx="40" cy="106" r="6" fill="#D94B4C" />
              </g>
            </svg>
          </button>

          <p class="hint" id="hint">[ PULL LEVER TO DISPATCH TICKETS ]</p>
        </div>
      </div>
  </section>

  <!-- ============ ABOUT / UNDER THE PRINTER ============ -->
  <section class="about" id="about">
    <div class="about-inner">

      <div class="stub-row">
        <span class="stub-tag">[ SUBJECT'S BIRTH: 2007 ]</span>
        <span class="stub-tag stub-tag--right" id="stubDate"></span>
      </div>

      <h1 class="name" id="name"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="bio" id="bio"></p>

      <div class="hobbies-block">
        <h2 class="block-label">SUBJECT'S HOBBIES & ANOMALIES</h2>
        <ul class="hobbies" id="hobbies"></ul>
      </div>

      <div class="socials-block">
        <h2 class="block-label">TRANSMISSION FREQUENCIES</h2>
        <div class="socials" id="socials"></div>
      </div>

      <div class="contact-slip">
        <div class="stamp-seal">APPROVED</div>
        <div class="slip-head">
          <span>COWORK!</span>
          <span></span>
        </div>
        <h2 class="slip-title" id="contactTitle">have a project in mind?</h2>
        <p class="slip-body" id="contactBody"></p>
        <div class="email-actions">
          <a class="email-btn" id="emailLink" href="#">
            <span id="emailLabel"></span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </a>

        </div>
        <p class="slip-note"> <span id=""></span></p>
      </div>

      <footer class="footer">
        <span id="footerLine"></span>
      </footer>

    </div>
  </section>

  <script src="script.js?v=50.0"></script>
</body>

</html>
